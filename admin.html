<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carol Studio — Pedidos</title><style>body{font:15px system-ui;background:#061923;color:#f3f9fb;margin:0;padding:25px}main{max-width:950px;margin:auto}input,textarea,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #3b7c84;background:#0e303d;color:white}button{cursor:pointer;background:#00e5d4;color:#032c32;font-weight:700}form{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}article{background:#0e303d;border:1px solid #2f6570;border-radius:14px;padding:20px;margin:15px 0}article p{overflow-wrap:anywhere}article textarea{width:95%;min-height:80px}article label{display:inline-grid;gap:5px;margin:5px}small{color:#b4cbd1}a{color:#00e5d4}</style><main><h1>Carol Studio — Painel de orçamentos</h1><p>Área privada. Os preços são definidos manualmente. Nenhuma proposta é enviada automaticamente.</p><form id="login"><input id="url" type="url" value="https://gbyjgvqhnqllmwynefbi.supabase.co" required><input id="anon" placeholder="Chave pública (anon/publishable)" required><input id="email" type="email" placeholder="E-mail administrativo" required><input id="password" type="password" placeholder="Senha" required><button>Entrar</button></form><p id="notice"></p><div id="orders"></div><a href="/">Voltar ao site</a></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';let sb,token;const $=x=>document.getElementById(x);$('login').onsubmit=async e=>{e.preventDefault();sb=createClient($('url').value,$('anon').value);const{data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('notice').textContent=error.message;return}token=data.session.access_token;$('password').value='';await load()};async function load(){const r=await fetch('/api/admin/leads',{headers:{Authorization:'Bearer '+token}});if(!r.ok){$('notice').textContent='Acesso negado ou sessão expirada';return}const {leads}=await r.json();$('notice').textContent=leads.length+' solicitação(ões)';$('orders').replaceChildren();for(const x of leads){const art=document.createElement('article');const title=document.createElement('h2');title.textContent=x.protocol+' — '+x.nome;art.append(title);for(const val of [x.created_at,x.email||'Sem e-mail',x.empresa||'Sem empresa',x.servico,x.ideia]){const p=document.createElement('p');p.textContent=val;art.append(p)}const form=document.createElement('form');const select=document.createElement('select');for(const st of ['aguardando_orcamento','em_analise','proposta_pronta','concluido']){const o=document.createElement('option');o.value=st;o.textContent=st;o.selected=x.status===st;select.append(o)}const price=document.createElement('input');price.type='number';price.min='0';price.step='0.01';price.placeholder='Valor em R$';price.value=x.preco_final??'';const answer=document.createElement('textarea');answer.placeholder='Descrição da proposta e condições';answer.value=x.resposta||'';const save=document.createElement('button');save.textContent='Salvar proposta';form.append(select,price,answer,save);form.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin/leads/'+x.id,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({status:select.value,preco_final:price.value===''?null:Number(price.value),resposta:answer.value})});$('notice').textContent=r.ok?'Proposta salva no painel.':'Falha ao salvar';};art.append(form);$('orders').append(art)}};</script></html>
